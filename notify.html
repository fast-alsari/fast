<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#075fcf">
<title>التبليغات | مدرسة التحدي الأهلية المختلطة</title>
<style>
:root{--p:#075fcf;--ps:#edf5ff;--g:#078b50;--r:#d92d20;--bg:#f5f8fc;--text:#172033;--muted:#667085;--border:#e3e9f1}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);z-index:10}.header-in{width:min(1100px,100%);min-height:68px;margin:auto;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{display:flex;align-items:center;gap:9px}.brand img{width:45px;height:45px;object-fit:contain}.brand h1{font-size:14px}.brand p{margin-top:3px;color:var(--p);font-size:8px;font-weight:900}.btn{min-height:39px;padding:0 12px;border:0;border-radius:10px;font-size:9px;font-weight:900;cursor:pointer}.btn-p{color:#fff;background:var(--p)}.btn-soft{color:var(--p);background:var(--ps)}.btn-g{color:#fff;background:var(--g)}.btn-r{color:#fff;background:var(--r)}
.main{width:min(1100px,100%);margin:auto;padding:14px}.hero{padding:17px;border-radius:18px;color:#fff;background:linear-gradient(135deg,#0870e8,#064594)}.hero h2{font-size:18px}.hero p{margin-top:5px;font-size:9px;line-height:1.8}.panel{margin-top:12px;border:1px solid var(--border);border-radius:15px;background:#fff;overflow:hidden}.panel-head{padding:12px 14px;border-bottom:1px solid var(--border)}.panel-head h3{font-size:13px}.panel-body{padding:13px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:8px;font-weight:900}.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:9px;outline:none}.field input,.field select{height:42px;padding:0 9px}.field textarea{min-height:110px;padding:9px;resize:vertical}.notice-list{display:grid;gap:8px}.notice{padding:11px;border:1px solid var(--border);border-radius:12px;background:#fff}.notice.off{opacity:.6}.notice-head{display:flex;justify-content:space-between;gap:8px}.notice h4{font-size:10px}.notice p{margin-top:6px;color:#475467;font-size:8px;line-height:1.7;white-space:pre-wrap}.notice-meta{margin-top:6px;color:var(--muted);font-size:7px}.notice-actions{display:flex;gap:5px;margin-top:8px}.toast{position:fixed;left:50%;top:78px;transform:translate(-50%,-8px);opacity:0;visibility:hidden;width:min(500px,calc(100% - 20px));padding:10px;border-radius:11px;background:#172033;color:#fff;text-align:center;font-size:9px;font-weight:900;transition:.2s}.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
@media(max-width:650px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}

.confirm-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(17,32,51,.66);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.confirm-overlay.show{display:flex}
.confirm-card{width:min(430px,100%);padding:22px 18px 18px;border-radius:20px;background:#fff;box-shadow:0 28px 80px rgba(0,0,0,.28);text-align:center}
.confirm-icon{width:60px;height:60px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;border-radius:18px;background:#fff1f0;color:#d92d20;font-size:28px;font-weight:900}
.confirm-card h3{font-size:15px;font-weight:900}
.confirm-card p{margin-top:8px;color:#667085;font-size:9px;line-height:1.8}
.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.confirm-actions button{height:44px;border:0;border-radius:11px;font-size:9px;font-weight:900;cursor:pointer}
.confirm-cancel{background:#f1f4f7;color:#475467}
.confirm-delete{background:#d92d20;color:#fff}
.confirm-delete:disabled{opacity:.55;cursor:default}

</style></head>
<body>
<header class="header"><div class="header-in"><div class="brand"><img src="logo.png" alt=""><div><h1>مدرسة التحدي الأهلية المختلطة</h1><p>قسم الحوكمة - التبليغات</p></div></div><div><button class="btn btn-soft" onclick="location.href='add.html'">الإدارة</button> <button class="btn btn-r" onclick="logout()">خروج</button></div></div></header>
<main class="main"><section class="hero"><h2>التبليغات</h2><p>أي تبليغ تحفظه هنا يظهر تلقائياً في صفحة الطالب حسب الطالب أو الصف أو للجميع.</p></section>
<section class="panel"><div class="panel-head"><h3>إرسال تبليغ</h3></div><div class="panel-body"><div class="form-grid">
<div class="field"><label>نوع المستلمين</label><select id="targetType"><option value="all">جميع الطلبة</option><option value="class">صف محدد</option><option value="student">طالب محدد</option></select></div>
<div class="field"><label>الصف</label><select id="classId"><option value="">اختر الصف</option></select></div>
<div class="field full"><label>الطالب</label><select id="studentCode"><option value="">اختر الطالب</option></select></div>
<div class="field full"><label>عنوان التبليغ</label><input id="title" maxlength="120" placeholder="عنوان التبليغ"></div>
<div class="field full"><label>نص التبليغ</label><textarea id="message" maxlength="1200" placeholder="اكتب التبليغ"></textarea></div>
<div class="field full"><button id="sendBtn" class="btn btn-p" onclick="sendNotice()">إرسال التبليغ</button></div>
</div></div></section>
<section class="panel">
<div class="panel-head" style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
  <h3>آخر التبليغات</h3>
  <button id="deleteAllBtn" class="btn btn-r" type="button" onclick="openDeleteAllConfirm()">حذف جميع التبليغات</button>
</div>
<div class="panel-body"><div id="noticeList" class="notice-list"></div></div>
</section></main>

<div id="deleteAllConfirm" class="confirm-overlay" role="dialog" aria-modal="true" aria-labelledby="deleteAllTitle">
  <div class="confirm-card">
    <div class="confirm-icon">!</div>
    <h3 id="deleteAllTitle">حذف جميع التبليغات</h3>
    <p>سيتم حذف جميع التبليغات نهائياً من قاعدة البيانات Firebase. لا يمكن التراجع عن هذه العملية.</p>
    <div class="confirm-actions">
      <button type="button" class="confirm-cancel" onclick="closeDeleteAllConfirm()">إلغاء</button>
      <button id="confirmDeleteAllBtn" type="button" class="confirm-delete" onclick="deleteAllNotices()">حذف الجميع</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script>
const DB="https://tahadi-school-default-rtdb.europe-west1.firebasedatabase.app",$=id=>document.getElementById(id),norm=v=>String(v||"").trim().toLowerCase(),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
let STUDENTS={},CLASSES={},NOTICES={},timer=0;
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");clearTimeout(timer);timer=setTimeout(()=>$("toast").classList.remove("show"),2600)}
async function req(path,method="GET",data){const o={method,cache:"no-store"};if(data!==undefined){o.headers={"Content-Type":"application/json"};o.body=JSON.stringify(data)}const r=await fetch(`${DB}/${path}.json`,o);if(!r.ok)throw new Error(`${method}_${r.status}`);return method==="DELETE"?true:r.json()}
const dbGet=p=>req(p),dbPatch=(p,d)=>req(p,"PATCH",d),dbPost=(p,d)=>req(p,"POST",d),dbDelete=p=>req(p,"DELETE");
function session(){try{return JSON.parse(sessionStorage.getItem("tahadi_session")||"{}")}catch{return{}}}
function adminCode(){return session().code||""}function logout(){sessionStorage.clear();localStorage.removeItem("tahadi_remembered_login");location.replace("index.html")}
function cameFromAdmin(){try{const r=new URL(document.referrer);return r.host===location.host&&/\/add\.html$/i.test(r.pathname)}catch{return false}}
function gateOk(code){try{const x=JSON.parse(sessionStorage.getItem("tahadi_notify_gate")||"{}");return x.code===code&&Date.now()-Number(x.at||0)<8*3600000}catch{return false}}
async function verifyAdmin(){const s=session();if(!s.code)return logout(),false;const u=await dbGet(`users/${encodeURIComponent(s.code)}`);if(!u||!["admin","administrator","add"].includes(norm(u.role))||u.active===false)return logout(),false;if(!gateOk(s.code)){if(!cameFromAdmin()){location.replace("add.html");return false}sessionStorage.setItem("tahadi_notify_gate",JSON.stringify({code:s.code,at:Date.now()}))}return true}
function fill(){const cls=Object.entries(CLASSES).sort((a,b)=>String(a[1]?.name||"").localeCompare(String(b[1]?.name||""),"ar"));$("classId").innerHTML='<option value="">اختر الصف</option>'+cls.map(([id,c])=>`<option value="${esc(id)}">${esc(c.name||id)}</option>`).join("");fillStudents();renderNotices();updateTargetUI()}
function fillStudents(){const cid=$("classId").value,rows=Object.entries(STUDENTS).map(([code,s])=>({code,...s})).filter(s=>s.hidden!==true&&(!cid||s.classId===cid)).sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"ar"));$("studentCode").innerHTML='<option value="">اختر الطالب</option>'+rows.map(s=>`<option value="${esc(s.code)}">${esc(s.name||s.code)} — ${esc(s.code)}</option>`).join("")}
function updateTargetUI(){const t=$("targetType").value;$("classId").disabled=t==="all";$("studentCode").disabled=t!=="student"}
async function sendNotice(){const type=$("targetType").value,title=$("title").value.trim(),message=$("message").value.trim(),classId=$("classId").value,studentCode=$("studentCode").value;if(!title||!message)return toast("اكتب العنوان ونص التبليغ");if(type==="class"&&!classId)return toast("اختر الصف");if(type==="student"&&!studentCode)return toast("اختر الطالب");const data={title,message,active:true,createdAt:Date.now(),createdBy:adminCode(),senderName:"إدارة مدرسة التحدي"};if(type==="class")data.classId=classId;if(type==="student"){data.studentCode=studentCode;data.classId=STUDENTS[studentCode]?.classId||""}const b=$("sendBtn");b.disabled=true;b.textContent="جاري الإرسال...";try{const r=await dbPost("notifications",data);if(r?.name)NOTICES[r.name]=data;$("title").value="";$("message").value="";renderNotices();toast("تم إرسال التبليغ")}catch(e){console.error(e);toast("تعذر إرسال التبليغ")}finally{b.disabled=false;b.textContent="إرسال التبليغ"}}
function targetText(n){if(n.studentCode)return`طالب: ${STUDENTS[n.studentCode]?.name||n.studentCode}`;if(n.classId)return`صف: ${CLASSES[n.classId]?.name||n.classId}`;return"جميع الطلبة"}
function renderNotices(){const rows=Object.entries(NOTICES).map(([id,n])=>({id,...n})).sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0)).slice(0,80);$("noticeList").innerHTML=rows.length?rows.map(n=>`<article class="notice ${n.active===false?"off":""}"><div class="notice-head"><h4>${esc(n.title||"تبليغ")}</h4><span style="font-size:7px;color:#98a2b3">${new Date(Number(n.createdAt||0)).toLocaleString("ar-IQ")}</span></div><p>${esc(n.message||n.text||"")}</p><div class="notice-meta">${esc(targetText(n))}</div><div class="notice-actions"><button class="btn btn-soft" onclick="toggleNotice('${esc(n.id)}',${n.active===false?"true":"false"})">${n.active===false?"تفعيل":"إيقاف"}</button><button class="btn btn-r" onclick="deleteNotice('${esc(n.id)}')">حذف</button></div></article>`).join(""):'<div style="padding:20px;text-align:center;color:#667085;font-size:9px">لا توجد تبليغات.</div>'}
async function toggleNotice(id,active){try{await dbPatch(`notifications/${encodeURIComponent(id)}`,{active});NOTICES[id].active=active;renderNotices()}catch(e){toast("تعذر تعديل التبليغ")}}
async function deleteNotice(id){try{await dbDelete(`notifications/${encodeURIComponent(id)}`);delete NOTICES[id];renderNotices();toast("تم حذف التبليغ")}catch(e){toast("تعذر حذف التبليغ")}}

function openDeleteAllConfirm(){
 if(!Object.keys(NOTICES||{}).length)return toast("لا توجد تبليغات للحذف");
 $("deleteAllConfirm").classList.add("show")
}
function closeDeleteAllConfirm(){
 $("deleteAllConfirm").classList.remove("show")
}
async function deleteAllNotices(){
 if(!Object.keys(NOTICES||{}).length){
  closeDeleteAllConfirm();
  return toast("لا توجد تبليغات للحذف")
 }
 const btn=$("confirmDeleteAllBtn"),mainBtn=$("deleteAllBtn");
 btn.disabled=true;mainBtn.disabled=true;btn.textContent="جاري الحذف...";
 try{
  await dbDelete("notifications");
  NOTICES={};
  renderNotices();
  closeDeleteAllConfirm();
  toast("تم حذف جميع التبليغات من قاعدة البيانات")
 }catch(e){
  console.error("DELETE_ALL_NOTIFICATIONS_ERROR",e);
  toast("تعذر حذف جميع التبليغات")
 }finally{
  btn.disabled=false;
  mainBtn.disabled=false;
  btn.textContent="حذف الجميع"
 }
}
$("deleteAllConfirm").addEventListener("click",e=>{
 if(e.target===$("deleteAllConfirm"))closeDeleteAllConfirm()
});
async function init(){if(!await verifyAdmin())return;try{const[s,c,n]=await Promise.all([dbGet("students"),dbGet("classes"),dbGet("notifications")]);STUDENTS=s||{};CLASSES=c||{};NOTICES=n||{};fill()}catch(e){console.error(e);toast("تعذر تحميل البيانات")}}
$("targetType").onchange=updateTargetUI;$("classId").onchange=fillStudents;window.addEventListener("load",init);
</script></body></html>
